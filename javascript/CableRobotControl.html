<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CableRobot</title>

    <link rel="stylesheet" href="./styles/style.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</head>

<body>
    <script type="importmap">
            {
                "imports": {
                    "three": "https://threejs.org/build/three.module.js",
                    "three/addons/": "https://threejs.org/examples/jsm/"
                }
            }
        </script>

    <div id="info">
        Orbit controls enabled via Mouse interaction<br />
        Toggle effector control via keyboard: "r" to rotate, "t" to translate<br />
    </div>

    <div class="test-overlay">

        <section id="menu">
            <div id="menu-header">
                <h2>Menu</h2>
                <img src="https://img.icons8.com/puffy/500/close-pane.png">
            </div>
            <div class="menu-btn active">
                <img src="https://img.icons8.com/puffy/500/home.png">
                <p>Accueil</p>
            </div>
            <div class="menu-btn">
                <img src="https://img.icons8.com/puffy/500/documents.png">
                <p>Documentation</p>
            </div>
        </section>



        <section id="main">
            <div>
                <h1>Interface de pilotage du Robot Parallèle à cables</h1>
            </div>
            <div id="panel">
                <div id="l-panel">
                    <div id="top-panel">
                        <div id="control" class="box">
                            <h3>Pilotage Manuel</h3>
                            <div></div>
                        </div>
                        <div id="params" class="box">
                            <h3>Parametrage</h3>
                            <div></div>
                        </div>
                    </div>
                    <div id="container-view" class="box">
                        <button class=""><img src="https://img.icons8.com/puffy/500/info.png"></button>
                        <button><img src="https://img.icons8.com/puffy/500/full-screen.png"></button>
                        <div id="robot-view"></div>
 
                    </div>
                    <div id="quick-actions" class="box row">
                        <button><img src="https://img.icons8.com/puffy-filled/500/home.png"></button>
                        <button><img src="https://img.icons8.com/puffy-filled/500/alarm.png"></button>
                        <button><img src="https://img.icons8.com/puffy-filled/500/stop.png"></button>
                        <button><img src="https://img.icons8.com/puffy-filled/500/stop.png"></button>
                    </div>
                </div>
                <div id="r-panel">
                    <div id="console" class="box">
                        <h3>Console</h3>
                        <hr>
                        <div>Données console...</div>
                    </div>
                    <div id="play-stop-actions" class="box row">
                        <button><img src="https://img.icons8.com/puffy-filled/500/stop.png"></button>
                        <button><img src="https://img.icons8.com/puffy-filled/500/stop.png"></button>
                    </div>
                </div>
            </div>
        </section>

    </div>



    <script lang="text/javascript" src="./scripts/simple-web-serial.min.js"></script>
    <script type="module" src="./scripts/robot_control.js"></script>
</body>

</html>
